name: Screenshots

# When someone adds a website to data/inspo.json, capture its preview image and commit it.
on:
  push:
    branches: [main]
    paths: ['data/inspo.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: false

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run shots
      - name: Commit new screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/shots
          if git diff --cached --quiet; then echo "No new screenshots"; exit 0; fi
          git commit -m "Add screenshots for new inspo links"
          git pull --rebase origin main
          git push
